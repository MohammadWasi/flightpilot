services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: flightpilot
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: flightpilot
    ports: ['127.0.0.1:5432:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flightpilot']
      interval: 5s
      retries: 10
volumes:
  postgres_data:
